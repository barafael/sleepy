name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # No apt packages, on purpose: sleepy-ui builds against winit and
      # glow, which load the display server's libraries at runtime rather
      # than link time, so even a headless runner needs nothing beyond
      # the toolchain. (Verified: `ldd sleepy-ui` shows only libc.)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The web build is the same window on another target, so it is asked
  # the same questions there: does it compile, and does clippy agree.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p sleepy-core -p sleepy-ui --target wasm32-unknown-unknown -- -D warnings

  # The MSRV is a promise, so a toolchain holds it to it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install 1.95 --profile minimal
      - run: cargo +1.95 check --workspace --all-targets
