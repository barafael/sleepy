[package]
name = "sleepy-ui"
description = "Put the machine to sleep after a while, from a window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sleepy-core = { workspace = true }
# x11 and wayland are how a window appears on Linux; sleepy is desktop-only
# by nature - a browser tab cannot put its machine to sleep - so there is no
# wasm build to gate these behind.
eframe = { workspace = true, features = ["x11", "wayland"] }
egui = { workspace = true }
humantime = { workspace = true }

# Desktop theme preference (winit reports none on Linux).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
# zbus hands out its signals as futures-core streams; this is the trait
# that pulls their items.
futures-util = { workspace = true }
