[workspace]
resolver = "3"
members = ["sleepy", "sleepy-core", "sleepy-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/barafael/sleepy"

[workspace.dependencies]
sleepy-core = { path = "sleepy-core", version = "0.1.0" }
anyhow = "1"
crossterm = "0.29"
eframe = { version = "0.37", default-features = false, features = [
  "glow",
  "default_fonts",
  "persistence",
] }
egui = "0.37"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
humantime = "2.4"
ratatui = "0.30"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
zbus = "6.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The house rules, once for every crate: no unsafe, and no unwraps
# outside the tests - sleepy talks to a machine that can always say no,
# and that answer deserves a plan, not a panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
