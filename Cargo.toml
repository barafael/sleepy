[workspace]
resolver = "3"
members = ["sleepy", "sleepy-core", "sleepy-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/barafael/sleepy"

[workspace.dependencies]
sleepy-core = { path = "sleepy-core", version = "0.1.0" }
anyhow = "1"
# only for the wall clock: what "23:45" means from here, and when it next comes
jiff = "0.2"
crossterm = "0.29"
eframe = { version = "0.37", default-features = false, features = [
  "glow",
  "default_fonts",
] }
egui = "0.37"
humantime = "2.4"
# the browser's clock and console, for the parts of sleepy that run on wasm
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# std's Instant and SystemTime panic on wasm; here they are std's own
# everywhere else, and the browser's clock where std has none
web-time = "1"
# sleepy draws the widgets that are always on: the defaults would add a
# calendar and the time crate behind it, layout macros the screen never
# calls, and a cache for a layout of four blocks.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "std"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The house rules, once for every crate: no unsafe, and no unwraps
# outside the tests - sleepy talks to a machine that can always say no,
# and that answer deserves a plan, not a panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
