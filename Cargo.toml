[workspace]
resolver = "3"
members = ["crates/sleepy", "crates/sleepy-core", "crates/sleepy-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/barafael/sleepy"

[workspace.dependencies]
sleepy-core = { path = "crates/sleepy-core", version = "0.1.0" }
anyhow = "1"
humantime = "2.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
