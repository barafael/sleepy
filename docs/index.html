<!doctype html>
<!--
  sleepy's web page: the frame around the window. The canvas is drawn by
  sleepy-ui itself - the same egui the native window wears, compiled to
  wasm - and this page only frames it and carries the news before the
  window is up: sleepy removes the loading line when it appears, and
  writes its bad news there when it does not. `trunk build --release`
  assembles this into /docs, where GitHub Pages serves the demo.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sleepy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💤</text></svg>" />
  
<script type="module">
import init, * as bindings from './sleepy-ui.js';
const wasm = await init({ module_or_path: './sleepy-ui_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <!-- GitHub Pages runs Jekyll unless told not to, and Jekyll knows no
     way to be careful with a wasm binary. -->
  
  <style>
    /* Gruvbox dark, as sleepy-ui/theme.rs dresses the window; the page
       stays out of the window's way and matches it while it wakes. */
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #1d2021; color: #bdae93;
      font: 15px/1.5 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    #loading { text-align: center; padding: 10px; }
    /* eframe follows the canvas's size on the page: a window's width,
       the page's height, centred. */
    canvas {
      display: block; margin: 0 auto;
      width: min(100%, 640px); height: 100vh;
    }
  </style>
<link rel="modulepreload" href="./sleepy-ui.js" crossorigin="anonymous" integrity="sha384-EgiyC1xZMxMZouvYgCT3uyNAayZFx+aIzhmyYHm0jChUKlqumQ3ThZxzDwkmWOWX"><link rel="preload" href="./sleepy-ui_bg.wasm" crossorigin="anonymous" integrity="sha384-aYgZ85SYGzfzIt8lKZDcDo91xKTbIhloQcXRuQOqR9BsKWDqDCjGUaaImIg+euxY" as="fetch" type="application/wasm"></head>
<body>
  <div id="loading">waking sleepy…</div>
  <canvas id="sleepy"></canvas>
</body>
</html>
