[package]
name = "sleepy-core"
description = "The sleep timer behind sleepy's frontends: what the machine can do, and when to do it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
humantime = { workspace = true }
jiff = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }

# The web build has no machine to sleep and no helper to run: it answers
# with notifications and a Wake Lock, and reads the browser's own clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "Document",
  "Navigator",
  "Notification",
  "NotificationOptions",
  "NotificationPermission",
  "VisibilityState",
  "WakeLock",
  "WakeLockSentinel",
  "WakeLockType",
  "Window",
] }
# the browser's Intl API is what answers "which zone is this clock in?"
jiff = { workspace = true, features = ["js"] }
